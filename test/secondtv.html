<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triple TV</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
body{
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  flex-direction: column;
}

.tv-shell {
  background: linear-gradient(145deg, #1e1e2e, #141420);
  border-radius: 20px;
  padding: 18px 18px 22px;
  width: 540px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.06),
    0 40px 80px rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(255,255,255,0.08);
  border: 2px solid rgb(179, 159, 159);
}

/* Title bar */
.title-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  position: relative;
  height: 18px;
}

.dots {
  position: absolute;
  left: 0;
  display: flex;
  gap: 6px;
}

.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}
.dot.red   { background: #ff5f57; }
.dot.yellow{ background: #febc2e; }
.dot.green { background: #28c840; }

.tv-title {
  font-family: 'Space Mono', monospace;
  font-size: 16px;
  letter-spacing: 1px;
  
  color: rgba(255,255,255,0.45);
  text-transform: uppercase;
}

.live-badge {
  position: absolute;
  right: 0;
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: #ff3b3b;
  letter-spacing: 1px;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ff3b3b;
  animation: pulse 1.4s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Screen */
.screen-wrapper {
  border-radius: 10px;
  overflow: hidden;
  background: #000;
  aspect-ratio: 16/9;
   
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  
}
</style>
</head>

<body>

<div class="tv-shell">

  <div class="title-bar">
    <div class="dots">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>

    <span class="tv-title">Perfect canvas TV</span>

    <div class="live-badge">
      <div class="live-dot"></div>
      LIVE
    </div>
  </div>

  <div class="screen-wrapper" id="wrraper">
 
  </div>

</div>
<br/><br/><br/><br/>
<input type="text" id="input">
<button id="button">watch</button>
<script>
 

 const input  = document.getElementById("input")
 const button  =document.getElementById("button")
 const wrraper  =document.getElementById("wrraper")


let AnalyzeLink  = function (link){
 
const  posLastSlah = link.lastIndexOf("/")
let result = link.substring(posLastSlah+1, link.length);
let path = `https://www.youtube.com/embed/${result}`
return path


}


 button.onclick = () =>{
  const res = AnalyzeLink(input.value) 
  wrraper.innerHTML =`
      <iframe
       src=${res}
       allowfullscreen>
    </iframe>

  `
 }

</script>
</body>
</html>
