<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
 
  .sp-panel {
    width: 220px;
    background: #ffffff;
    border: 0.5px solid #e2dfda;
    border-radius: 12px;
    padding: 14px 14px 12px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
  }

  .sp-section {
    border-bottom: 0.5px solid #eeece8;
    padding-bottom: 10px;
    margin-bottom: 10px;
  }
  .sp-section:last-child { border-bottom: none; margin-bottom: 0; }

  .sp-section-title {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: #b0ada6;
    margin-bottom: 9px;
  }

  .sp-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
  }
  .sp-row:last-child { margin-bottom: 0; }

  .sp-label {
    flex: 1;
    color: #6e6b65;
    font-size: 12px;
    white-space: nowrap;
  }
  .sp-val {
    font-size: 12px;
    font-weight: 500;
    color: #1a1917;
    min-width: 30px;
    text-align: right;
  }

  .sp-row input[type=range] {
    flex: 1.4;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    background: #e2dfda;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .sp-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #3B8BEB;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px #3B8BEB;
    cursor: pointer;
  }
  .sp-row input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #3B8BEB;
    border: 2px solid #fff;
    cursor: pointer;
  }

  .sp-select {
    flex: 1;
    background: #f7f6f3;
    border: 0.5px solid #e2dfda;
    border-radius: 6px;
    color: #1a1917;
    font-size: 12px;
    padding: 4px 6px;
    cursor: pointer;
    outline: none;
  }

  .sp-checkbox-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 7px;
  }
  .sp-checkbox-row input[type=checkbox] {
    accent-color: #3B8BEB;
    cursor: pointer;
    width: 13px; height: 13px;
  }

  .sp-swatch-label {
    font-size: 11px;
    color: #9e9b95;
    margin-bottom: 5px;
  }
  .sp-swatch-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .sp-swatch {
    width: 20px; height: 20px;
    border-radius: 4px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: transform 0.12s;
  }
  .sp-swatch:hover { transform: scale(1.15); }
  .sp-swatch.active { border-color: #1a1917; }
  .sp-swatch.light { border-color: #d8d5cf; }
  .sp-swatch.light.active { border-color: #3B8BEB; }

  .sp-btns { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .sp-btn-row { display: flex; gap: 6px; }

  .sp-btn {
    flex: 1;
    padding: 7px 0;
    background: #f7f6f3;
    border: 0.5px solid #e2dfda;
    border-radius: 7px;
    color: #1a1917;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.1s;
  }
  .sp-btn:hover { background: #eeecea; }
  .sp-btn:active { transform: scale(0.98); }

  .sp-btn.primary {
    background: #3B8BEB;
    color: #fff;
    border-color: transparent;
  }
  .sp-btn.primary:hover { background: #2b7de0; }
</style>
</head>
<body>

<div class="sp-panel">

  <div class="sp-section">
    <div class="sp-section-title">Stroke</div>
    <div class="sp-row">
      <span class="sp-label">Size</span>
      <input type="range" id="size" min="1" max="64" value="16" step="1">
      <span class="sp-val" id="size-v">16</span>
    </div>
    <div class="sp-row">
      <span class="sp-label">Thinning</span>
      <input type="range" id="thinning" min="-1" max="1" value="0.5" step="0.01">
      <span class="sp-val" id="thinning-v">0.5</span>
    </div>
    <div class="sp-row">
      <span class="sp-label">Streamline</span>
      <input type="range" id="streamline" min="0" max="1" value="0.5" step="0.01">
      <span class="sp-val" id="streamline-v">0.5</span>
    </div>
    <div class="sp-row">
      <span class="sp-label">Smoothing</span>
      <input type="range" id="smoothing" min="0" max="1" value="0.5" step="0.01">
      <span class="sp-val" id="smoothing-v">0.5</span>
    </div>
    <div class="sp-row">
      <span class="sp-label">Easing</span>
      <select class="sp-select" id="easing">
        <option>Linear</option>
        <option>Ease In</option>
        <option>Ease Out</option>
        <option>Ease InOut</option>
      </select>
    </div>
  </div>

  <div class="sp-section">
    <div class="sp-section-title">Taper</div>
    <div class="sp-row">
      <span class="sp-label">Taper start</span>
      <input type="range" id="taper-start" min="0" max="100" value="0" step="1">
      <span class="sp-val" id="taper-start-v">0</span>
    </div>
    <div class="sp-checkbox-row">
      <span class="sp-label">Cap start</span>
      <input type="checkbox" id="cap-start" checked>
    </div>
    <div class="sp-row">
      <span class="sp-label">Taper end</span>
      <input type="range" id="taper-end" min="0" max="100" value="0" step="1">
      <span class="sp-val" id="taper-end-v">0</span>
    </div>
    <div class="sp-checkbox-row">
      <span class="sp-label">Cap end</span>
      <input type="checkbox" id="cap-end" checked>
    </div>
  </div>

  <div class="sp-section">
    <div class="sp-section-title">Color</div>
    <div class="sp-swatch-label">Fill</div>
    <div class="sp-swatch-row" id="fill-swatches"></div>
    <div class="sp-row" style="margin-top:10px">
      <span class="sp-label">Stroke width</span>
      <input type="range" id="stroke-w" min="0" max="12" value="4" step="0.5">
      <span class="sp-val" id="stroke-w-v">4</span>
    </div>
    <div class="sp-swatch-label" style="margin-top:6px">Stroke color</div>
    <div class="sp-swatch-row" id="stroke-swatches"></div>
  </div>

  <div class="sp-btns">
    <div class="sp-btn-row">
      <button class="sp-btn" onclick="resetOptions()">Reset options</button>
      <button class="sp-btn" onclick="copyOptions()">Copy options</button>
    </div>
    <button class="sp-btn primary" onclick="alert('Copied to SVG!')">Copy to SVG</button>
  </div>

</div>

<script>
  const COLORS = [
    { hex: '#1a1917', light: false },
    { hex: '#f5a623', light: false },
    { hex: '#e8462a', light: false },
    { hex: '#e91e8c', light: false },
    { hex: '#9b27af', light: false },
    { hex: '#00bcd4', light: false },
    { hex: '#4caf50', light: false },
    { hex: '#ffffff', light: true  },
  ];

  function buildSwatches(containerId, initial) {
    const el = document.getElementById(containerId);
    COLORS.forEach(({ hex, light }) => {
      const s = document.createElement('div');
      s.className = 'sp-swatch' + (light ? ' light' : '') + (hex === initial ? ' active' : '');
      s.style.background = hex;
      s.onclick = () => {
        el.querySelectorAll('.sp-swatch').forEach(x => x.classList.remove('active'));
        s.classList.add('active');
      };
      el.appendChild(s);
    });
  }

  buildSwatches('fill-swatches', '#1a1917');
  buildSwatches('stroke-swatches', '#1a1917');

  const SLIDERS = [
    ['size',        'size-v',        v => v],
    ['thinning',    'thinning-v',    v => parseFloat(v).toFixed(2)],
    ['streamline',  'streamline-v',  v => parseFloat(v).toFixed(2)],
    ['smoothing',   'smoothing-v',   v => parseFloat(v).toFixed(2)],
    ['taper-start', 'taper-start-v', v => v],
    ['taper-end',   'taper-end-v',   v => v],
    ['stroke-w',    'stroke-w-v',    v => v],
  ];

  SLIDERS.forEach(([id, vid, fmt]) => {
    document.getElementById(id).oninput = function () {
      document.getElementById(vid).textContent = fmt(this.value);
    };
  });

  function resetOptions() {
    document.getElementById('size').value        = 16;
    document.getElementById('thinning').value    = 0.5;
    document.getElementById('streamline').value  = 0.5;
    document.getElementById('smoothing').value   = 0.5;
    document.getElementById('taper-start').value = 0;
    document.getElementById('taper-end').value   = 0;
    document.getElementById('stroke-w').value    = 4;
    SLIDERS.forEach(([id, vid, fmt]) => {
      document.getElementById(vid).textContent = fmt(document.getElementById(id).value);
    });
  }

  function copyOptions() {
    const opts = {
      size:       +document.getElementById('size').value,
      thinning:   +document.getElementById('thinning').value,
      streamline: +document.getElementById('streamline').value,
      smoothing:  +document.getElementById('smoothing').value,
      taperStart: +document.getElementById('taper-start').value,
      taperEnd:   +document.getElementById('taper-end').value,
      strokeWidth:+document.getElementById('stroke-w').value,
    };
    navigator.clipboard.writeText(JSON.stringify(opts, null, 2))
      .then(() => alert('Copied!'))
      .catch(() => alert(JSON.stringify(opts, null, 2)));
  }
</script>
</body>
</html>
